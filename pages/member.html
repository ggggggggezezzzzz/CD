<div id="memberList"></div>

<script>
async function displayMembers() {

    const { data, error } = await supabaseClient
        .from("members")
        .select("*")
        .order("created_at", { ascending: true });

    const list = document.getElementById("memberList");

    if (error) {
        list.innerHTML = "<p>โหลดสมาชิกไม่สำเร็จ</p>";
        return;
    }

    list.innerHTML = "";

    // รายการยศที่ต้องการแสดง
    const roles = [
        "",
        "",
        "FOUNDER",
        "MEMBER"
    ];

    roles.forEach(role => {

        const members = data.filter(member => member.role === role);

        // ถ้าไม่มียศนี้ ไม่ต้องแสดง
        if (members.length === 0) return;

        const section = document.createElement("section");
        section.className = "role-section";

        section.innerHTML = `
            <div class="role-header">
                <span>${role}</span>
                <small>${members.length} MEMBERS</small>
            </div>

            <div class="member-grid"></div>
        `;

        const grid = section.querySelector(".member-grid");

        members.forEach(member => {

            const card = document.createElement("div");
            card.className = "member-card";

            card.innerHTML = `
                <img src="../images/${member.avatar}" class="member-image">

                <div class="member-info">
                    <h3>${member.name}</h3>
                    <p>${member.status}</p>
                </div>
            `;

            grid.appendChild(card);
        });

        list.appendChild(section);
    });
}

displayMembers();
</script>

<script>
const roleInfo = {
    OWNER: {
        name: "OWNER",
        description: "ผู้ดูแลสูงสุดของเว็บไซต์และชุมชน"
    },

    ADMIN: {
        name: "ADMIN",
        description: "ผู้ดูแลระบบและจัดการสมาชิก"
    },

    MODERATOR: {
        name: "MODERATOR",
        description: "ดูแลความเรียบร้อยและช่วยเหลือสมาชิก"
    },

    MEMBER: {
        name: "MEMBER",
        description: "สมาชิกทั่วไปของชุมชน"
    }
};

async function displayMembers() {

    const { data, error } = await supabaseClient
        .from("members")
        .select("*")
        .order("created_at", {
            ascending: true
        });

    const list = document.getElementById("memberList");

    if (error) {
        list.innerHTML = "<p>โหลดสมาชิกไม่สำเร็จ</p>";
        return;
    }

    list.innerHTML = "";

    const roles = [
        "OWNER",
        "ADMIN",
        "MODERATOR",
        "MEMBER"
    ];

    roles.forEach(role => {

        const members = data.filter(
            member => member.role === role
        );

        if (members.length === 0) return;

        const info = roleInfo[role];

        const section = document.createElement("section");

        section.className = "role-section";

        section.innerHTML = `
            <div class="role-title">
                <h2>${info.name}</h2>
                <p>${info.description}</p>
            </div>

            <div class="member-grid"></div>
        `;

        const grid =
            section.querySelector(".member-grid");

        members.forEach(member => {

            const card =
                document.createElement("div");

            card.className = "member-card";

            card.innerHTML = `
                <img
                    src="../images/${member.avatar}"
                    class="member-image"
                >

                <div class="member-info">

                    <h3>${member.name}</h3>

                    <span class="member-role">
                        ${member.role}
                    </span>

                    <p>${member.status}</p>

                </div>
            `;

            grid.appendChild(card);
        });

        list.appendChild(section);
    });
}

displayMembers();
</script>
